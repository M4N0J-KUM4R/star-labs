[package]
name = "star-ui"
version.workspace = true
edition.workspace = true

[dependencies]
tower = { workspace = true }
star-common = { path = "../star-common" }
star-auth = { path = "../star-auth" }
star-courses = { path = "../star-courses" }
star-pages = { path = "../star-pages" }
star-modules = { path = "../star-modules" }
star-quizzes = { path = "../star-quizzes" }
star-assignments = { path = "../star-assignments" }
star-grading-standards = { path = "../star-grading-standards" }
star-discussions = { path = "../star-discussions" }
star-conversations = { path = "../star-conversations" }
star-files = { path = "../star-files" }
star-announcements = { path = "../star-announcements" }
star-calendar = { path = "../star-calendar" }
star-enrollments = { path = "../star-enrollments" }
star-submission-comments = { path = "../star-submission-comments" }
star-rubrics = { path = "../star-rubrics" }
axum = { workspace = true }
axum-extra = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
askama = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
time = { workspace = true }
# Form parsing for the quiz take form: the question field names are dynamic
# (`question_<id>`, `question_<id>_answer_<answer_id>`), so serde_urlencoded
# cannot type them — the submit handler decodes raw pairs from the body.
url = { workspace = true }

# build.rs embeds migration/ui/{build,static} into the binary and hashes each file.
# sha2 is already an ordinary dependency of this package, so the lockfile does not
# change: it records one flat dependency set per package, not per kind. CI builds with
# `--locked` (browser-smoke.yml), which a genuinely new dependency would break.
[build-dependencies]
sha2 = { workspace = true }

[dev-dependencies]
star-db = { path = "../star-db" }
star-auth = { path = "../star-auth" }
axum-test = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
