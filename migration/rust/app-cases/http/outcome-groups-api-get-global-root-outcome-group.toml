[request]
method = "GET"
path = "/api/v1/global/root_outcome_group"

[request.headers]
Authorization = "Bearer parity-replay-access-token"

[response]
status = 302

[response.headers]
cache-control = "no-cache"
content-security-policy = "frame-ancestors 'self' 54.252.48.186;"
content-type = "[..]/[..]; charset=utf-8"
referrer-policy = "no-referrer-when-downgrade"
set-cookie = "[..]"
x-canvas-meta = "[..]"
x-content-type-options = "nosniff"
x-download-options = "noopen"
x-permitted-cross-domain-policies = "none"
x-rate-limit-remaining = "600.0"
x-request-context-id = "[..]-[..]-[..]-[..]-[..]"
x-request-cost = "0.[..]"
x-runtime = "0.[..]"
x-xss-protection = "1; mode=block"
