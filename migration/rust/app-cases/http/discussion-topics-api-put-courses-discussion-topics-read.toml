[request]
method = "PUT"
path = "/api/v1/courses/1/discussion_topics/1/read"

[request.headers]
Authorization = "Bearer parity-replay-access-token"

[response]
status = 204

[response.headers]
cache-control = "no-cache"
content-security-policy = "frame-ancestors 'self' 54.252.48.186;"
referrer-policy = "no-referrer-when-downgrade"
set-cookie = "[..]"
x-canvas-meta = "[..]"
x-canvas-user-id = "10000000000001"
x-content-type-options = "nosniff"
x-download-options = "noopen"
x-permitted-cross-domain-policies = "none"
x-rate-limit-remaining = "600.0"
x-request-context-id = "[..]-[..]-[..]-[..]-[..]"
x-request-cost = "0.[..]"
x-runtime = "0.[..]"
x-session-id = "[..]"
x-xss-protection = "1; mode=block"
