[request]
method = "PUT"
path = "/api/v1/sections/2/submissions/bulk_mark_read"

[request.headers]
Authorization = "Bearer __REPLAY_TOKEN__"

[response]
status = 204

[response.headers]
cache-control = "no-cache"
content-security-policy = "frame-ancestors 'self' 54.252.48.186;"
referrer-policy = "no-referrer-when-downgrade"
set-cookie = "[..]"
x-canvas-meta = "[..]"
x-content-type-options = "nosniff"
x-download-options = "noopen"
x-permitted-cross-domain-policies = "none"
x-rate-limit-remaining = "600.0"
x-request-context-id = "[..]-[..]-[..]-[..]-[..]"
x-request-cost = "0.[..]"
x-runtime = "0.[..]"
x-xss-protection = "1; mode=block"
