[workspace]
resolver = "2"
members = [
    "crates/star-http",
    "crates/star-auth",
    "crates/star-users",
    "crates/star-courses",
    "crates/star-assignments",
    "crates/star-content",
    "crates/star-db",
    "crates/star-common",
    "crates/star-quizzes",
    "crates/star-files",
    "crates/star-enrollments",
    "crates/star-pages",
    "crates/star-modules",
    "crates/star-announcements",
    "crates/star-dashboard",
    "crates/star-api",
    "crates/star-assignment-groups",
    "crates/star-accounts",
    "crates/star-calendar",
    "crates/star-conversations",
    "crates/star-discussions",
    "crates/star-grading-standards",
    "crates/star-groups",
    "crates/star-notifications",
    "crates/star-outcomes",
    "crates/star-rubrics",
    "crates/star-submission-comments",
    "crates/star-permissions",
    "crates/star-jobs",
    "crates/star-lti",
    "crates/star-features",
    "crates/star-learning-dates",
    "crates/star-audit",
    "crates/star-media",
    "crates/star-graphql",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
argon2 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
axum-test = { version = "17.0.0", default-features = false }
futures = "0.3"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
lto = "thin"
