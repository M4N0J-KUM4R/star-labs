name: Nightly compatibility

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Run the suite against the Supabase test schema (session pooler, 2 threads).
  # Configure SUPABASE_DATABASE_URL as a repository secret; the job skips
  # cleanly when the secret is absent.
  # ---------------------------------------------------------------------------
  supabase:
    name: Supabase compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      STAR_JWT_SECRET: nightly-supabase-test-secret
    steps:
      - name: Check secret
        id: gate
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DATABASE_URL is not configured; skipping Supabase compatibility run"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.available == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.available == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.available == 'true'
        with:
          workspaces: migration -> target
      - name: Run workspace tests against Supabase
        if: steps.gate.outputs.available == 'true'
        working-directory: migration
        run: cargo test --workspace --exclude star-http --locked --no-fail-fast -- --test-threads=2
      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.gate.outputs.available }}" = "true" ]; then
            echo "Supabase compatibility suite completed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Supabase compatibility suite skipped: SUPABASE_DATABASE_URL not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Coverage against PostgreSQL 16 (non-blocking nightly signal).
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: star
          POSTGRES_PASSWORD: star-test-only
          POSTGRES_DB: star_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U star -d star_lms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://star:star-test-only@localhost:5432/star_lms_test
      STAR_JWT_SECRET: nightly-coverage-test-secret
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration -> target
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --exclude star-http --locked --lcov --output-path lcov.info
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f lcov.info ]; then
            cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: migration/lcov.info
          if-no-files-found: warn
          retention-days: 14
