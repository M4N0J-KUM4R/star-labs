name: Nightly compatibility

# Nightly signal, not a merge gate. Two independent lanes:
#
# 1. Supabase compatibility: the workspace suite (minus star-http) against the
#    remote Supabase test schema. The suite is sharded across 4 parallel legs,
#    balanced by measured per-crate wall time (see orchestration/CI-THROUGHPUT.md
#    wave 5): a single serial `cargo test --workspace` invocation ran test
#    binaries one at a time, each capped at --test-threads=2 over the session
#    pooler, and summed to ~75 min. Concurrent legs are safe by the repo ground
#    rule: every DB-backed test seeds under a unique-per-run prefix (pid +
#    millis) with full teardown, so parallel legs never collide on data — the
#    measured failure mode of the first 8-leg attempt was purely connection
#    saturation, zero data races.
#
#    SHARD COUNT IS POOLER-BOUND, not runner-bound: the Supabase session
#    pooler rejects connections beyond its client ceiling
#    (EMAXCONNSESSION "max clients reached in session mode - max clients are
#    limited to pool_size: 15", measured on the 8-leg attempt, 2026-11-19).
#    Each leg holds ~2-3 clients at --test-threads=2 (one pool per test,
#    2 tests in flight, pool churn between tests), so 4 legs peak at ~8-12
#    clients. Do not widen the matrix without raising the pooler limit
#    (Supabase dashboard) or switching DATABASE_URL to the transaction pooler
#    (needs re-validating sqlx migrate advisory locks first).
#
#    A preflight job checks the secret and Supabase connectivity once (plus the
#    shard-map coverage guard), then a fan-in gate keeps the single
#    `Supabase compatibility` name for the run summary.
#
# 2. Coverage against PostgreSQL 16 (llvm-cov), unchanged.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Preflight: secret gate, one-shot connectivity check, shard-map guard.
  # Runs the apt/psql install once instead of once per shard, and fails the
  # workflow in ~1 min on bad credentials instead of after 8 shard setups.
  # ---------------------------------------------------------------------------
  preflight:
    name: Supabase preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      available: ${{ steps.gate.outputs.available }}
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Check secret
        id: gate
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_DATABASE_URL is not configured; skipping Supabase compatibility run"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - name: Nightly shard map covers every crate exactly once
        run: python3 tools/ci/shard_coverage.py --workflow .github/workflows/nightly-compat.yml --exclude star-http
      - name: Verify Supabase connectivity
        if: steps.gate.outputs.available == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT current_schema()"

  # ---------------------------------------------------------------------------
  # Shard map: every workspace crate except star-http is assigned to exactly
  # one of 4 legs (asserted by the preflight guard). Legs are balanced by the
  # per-crate wall times measured from the 2026-11-19 4-leg validation run
  # (LPT packing, ~21.2 min of tests per leg). fail-fast stays off: the nightly
  # run's value is the full signal, so one failing leg must not cancel the
  # others. Shard count rationale: see the pooler ceiling note in the header.
  # ---------------------------------------------------------------------------
  supabase-shard:
    name: Supabase shard ${{ matrix.shard }} of 4
    needs: preflight
    if: needs.preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            crates: >-
              -p star-announcements -p star-assignment-groups -p star-assignments
              -p star-calendar -p star-common -p star-conferences
              -p star-conversations -p star-dashboard -p star-features
              -p star-learning-dates -p star-modules -p star-permissions
          - shard: 2
            crates: >-
              -p star-account-reports -p star-collaborations -p star-discussions
              -p star-eportfolios -p star-grading-standards -p star-graphql
              -p star-jobs -p star-media -p star-notifications -p star-pages
          - shard: 3
            crates: >-
              -p star-audit -p star-auth -p star-courses -p star-files
              -p star-lti -p star-quizzes -p star-rubrics -p star-search
              -p star-users
          - shard: 4
            crates: >-
              -p star-accounts -p star-api -p star-content -p star-db
              -p star-enrollments -p star-groups -p star-outcomes
              -p star-polling -p star-sis -p star-submission-comments
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      STAR_JWT_SECRET: nightly-supabase-test-secret
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration -> target
          shared-key: nightly-shard-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run shard ${{ matrix.shard }} against Supabase
        run: |
          # GitHub runs steps with `bash -e`; this script must survive a
          # failing cargo invocation to classify and retry, so -e goes off
          # and every failure is handled explicitly.
          set +e
          set -u
          log="$(mktemp)"
          cargo test --locked --no-fail-fast ${{ matrix.crates }} -- --test-threads=2 2>&1 | tee "$log"
          rc="${PIPESTATUS[0]}"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          # 4 legs peak at ~8-12 pooler clients but transient churn spikes can
          # still graze the 15-client session-pooler ceiling (measured: ~2% of
          # tests across the 2026-11-19 validation run, 100% of all failures).
          # When every failed test looks like infrastructure noise, retry just
          # those tests once; real failures exit here and fail the shard.
          if ! names="$(python3 ../tools/ci/nightly_retry.py "$log")"; then
            echo "::error::shard ${{ matrix.shard }} has real test failures — no retry"
            exit "$rc"
          fi
          if [ -z "$names" ]; then
            echo "::error::shard ${{ matrix.shard }} failed with no retriable tests (build error?)"
            exit "$rc"
          fi
          # shellcheck disable=SC2086
          count="$(printf '%s\n' $names | wc -l)"
          echo "::warning::shard ${{ matrix.shard }}: $count test(s) hit session-pooler saturation; retrying once after 60s"
          sleep 60
          # shellcheck disable=SC2086
          cargo test --locked ${{ matrix.crates }} -- --exact $names --test-threads=2

      - name: Summarize shard
        if: always()
        run: |
          echo "Supabase shard ${{ matrix.shard }}: done." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Fan-in gate: keeps the single `Supabase compatibility` job name (and the
  # step summary) that the pre-shard workflow exposed. Skips green when the
  # secret is absent; fails when any shard or the preflight failed.
  # ---------------------------------------------------------------------------
  supabase:
    name: Supabase compatibility
    needs: [preflight, supabase-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Supabase shard to have passed
        run: |
          set -euo pipefail
          echo "preflight:  ${{ needs.preflight.result }}"
          echo "available:  ${{ needs.preflight.outputs.available }}"
          echo "shards:     ${{ needs.supabase-shard.result }}"
          if [ "${{ needs.preflight.outputs.available }}" != "true" ]; then
            echo "Supabase compatibility suite skipped: SUPABASE_DATABASE_URL not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ needs.preflight.result }}" != "success" ]; then
            echo "::error::Supabase preflight failed (secret gate, shard-map guard, or connectivity check)"
            exit 1
          fi
          if [ "${{ needs.supabase-shard.result }}" != "success" ]; then
            echo "::error::Supabase shards did not all pass"
            exit 1
          fi
          echo "Supabase compatibility suite completed (4 parallel shards)." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Coverage against PostgreSQL 16 (non-blocking nightly signal).
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: star
          POSTGRES_PASSWORD: star-test-only
          POSTGRES_DB: star_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U star -d star_lms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://star:star-test-only@localhost:5432/star_lms_test
      STAR_JWT_SECRET: nightly-coverage-test-secret
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration -> target
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --exclude star-http --locked --lcov --output-path lcov.info
      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f lcov.info ]; then
            cargo llvm-cov report --summary-only | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: migration/lcov.info
          if-no-files-found: warn
          retention-days: 14
