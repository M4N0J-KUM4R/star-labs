name: Rust migration validation

# Fan-out validation: every job starts at once (no serial `needs:` chain).
# The workspace test suite is sharded across 4 parallel runners, each with its
# own PostgreSQL 16 service, then a cheap `test` gate job fans the shards in so
# the required check name stays exactly `test` (protocol: issue #20).

on:
  push:
    paths:
      - 'migration/**'
      - '.github/workflows/rust-migration.yml'
  pull_request:
    paths:
      - 'specs/**'
      - 'migration/**'
      - 'orchestration/**'
      - 'tools/ci/**'
      - '.github/workflows/rust-migration.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Shard map: crates are partitioned by measured test count so all four shards
  # finish at roughly the same time. Every crate appears exactly once; the
  # `shard-coverage` job below asserts the partition stays complete.
  # ---------------------------------------------------------------------------
  test-shard:
    name: Test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            crates: >-
              -p star-assignments -p star-courses -p star-api -p star-common
              -p star-db -p star-http -p star-announcements -p star-media
              -p star-account-reports -p star-collaborations -p star-conferences
          - shard: 2
            crates: >-
              -p star-notifications -p star-accounts -p star-enrollments
              -p star-permissions -p star-groups -p star-assignment-groups
              -p star-jobs
              -p star-eportfolios -p star-polling -p star-search -p star-sis
          - shard: 3
            crates: >-
              -p star-auth -p star-users -p star-discussions -p star-quizzes
              -p star-modules -p star-conversations -p star-submission-comments
              -p star-features -p star-audit
          - shard: 4
            crates: >-
              -p star-pages -p star-content -p star-grading-standards
              -p star-files -p star-graphql -p star-learning-dates
              -p star-rubrics -p star-dashboard -p star-calendar
              -p star-outcomes -p star-lti
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: star
          POSTGRES_PASSWORD: star-test-only
          POSTGRES_DB: star_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U star -d star_lms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://star:star-test-only@localhost:5432/star_lms_test
      STAR_JWT_SECRET: github-actions-test-secret
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration -> target
          shared-key: shard-${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Migrate schema (shards are order-independent)
        run: cargo test -p star-db --locked
      - name: Run workspace shard ${{ matrix.shard }}
        run: cargo test --locked --no-fail-fast ${{ matrix.crates }}

  # ---------------------------------------------------------------------------
  # Guards the shard map: a new crate that nobody added to a shard would
  # otherwise be silently untested.
  # ---------------------------------------------------------------------------
  shard-coverage:
    name: Shard coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every workspace member is assigned to exactly one shard
        run: python3 tools/ci/shard_coverage.py

  # ---------------------------------------------------------------------------
  # Fan-in gate. This job's name is the required status check `test`.
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test-shard, shard-coverage]
    if: always()
    steps:
      - name: Require every shard to have passed
        run: |
          set -euo pipefail
          echo "test-shard:      ${{ needs.test-shard.result }}"
          echo "shard-coverage:  ${{ needs.shard-coverage.result }}"
          if [ "${{ needs.test-shard.result }}" != "success" ] ||
             [ "${{ needs.shard-coverage.result }}" != "success" ]; then
            echo "::error::workspace test shards did not all pass"
            exit 1
          fi
          echo "all shards green"
