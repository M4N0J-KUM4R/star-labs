name: Parity scoreboard

on:
  push:
    branches: [main]
    paths:
      - 'migration/**'
      - '.github/workflows/parity.yml'
  pull_request:
    paths:
      - 'migration/**'
      - '.github/workflows/parity.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Also commit the generated report to the parity-data branch'
        type: choice
        required: false
        default: 'no'
        options:
          - 'no'
          - 'yes'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static registration-parity report (route/path analysis, no database).
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - name: Generate parity report
        run: |
          python3 tools/parity/parity.py report \
            --manifest parity/canvas_manifest.json \
            --star-src . \
            --out parity
      - name: Publish report summary
        if: always()
        run: cat parity/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: migration/parity/
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Behavioral parity harness (issue #231): drives the full production
  # router against a real, migrated Postgres and probes every Canvas
  # manifest route. Runs in parallel with the static report job above —
  # the two measure different things and share no work.
  #
  # Gate: the four measured dimensions (registration, anonymous authz,
  # robustness, pagination) and the specified behavioral contracts must
  # stay at zero failures; `expectations.specified_routes` grows over
  # time, so the number specified is reported, not gated.
  # -----------------------------------------------------------------------
  behavior-parity:
    name: Behavioral parity (issue #231)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: migration
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: star
          POSTGRES_PASSWORD: star-test-only
          POSTGRES_DB: star_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U star -d star_lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://star:star-test-only@localhost:5432/star_lms_test
      STAR_JWT_SECRET: github-actions-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration -> target
          shared-key: behavior-parity
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the behavioral parity harness
        run: cargo run --locked -p star-http --example behavior_parity
      - name: Scorecard
        if: always()
        run: cat parity/behavior/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Gate on measured-dimension regressions
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, sys
          report = json.load(open("parity/behavior/report.json"))
          dims = report["dimensions"]
          gated = ["registration", "authz_anonymous", "robustness_malformed_id",
                   "pagination_index", "expectations"]
          failed = {k: dims[k]["fail"] for k in gated if dims[k].get("fail", 0) > 0}
          for k in gated:
              d = dims[k]
              print(f"{k}: {d.get('pass', 0)} pass / {d.get('fail', 0)} fail")
          if failed:
              print("::error::behavioral parity regressed: " +
                    ", ".join(f"{k}={v} fail" for k, v in failed.items()))
              sys.exit(1)
          print("all measured behavioral-parity dimensions at zero failures")
          EOF
      - name: Upload behavioral parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-parity-report
          path: migration/parity/behavior/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Commit the generated scoreboard so the numbers are versioned instead of
  # living only in an expiring artifact (issue #74).
  #
  # The target is the `parity-data` branch, never `main`: the `Phase 4 main
  # gate` ruleset puts main behind a `pull_request` rule with no bypass actors,
  # so a workflow token cannot write there, and the merge protocol (issue #20)
  # keeps every main write under the coordinator's exact-SHA gate.
  #
  # The committed bytes are the `parity-report` artifact itself (downloaded,
  # never recomputed), so the branch and the artifact cannot disagree.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish parity report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: parity
    # `report` exits non-zero on a coverage regression, so a failing `parity`
    # job skips this one and the previously published numbers stand.
    #
    # Publishing only from `push` to main cannot self-trigger: CI writes only to
    # parity-data, never to main, and a GITHUB_TOKEN push does not start further
    # workflow runs. The workflow_dispatch input exists to rehearse the publish
    # on a lane branch before it merges.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'yes')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The artifact stores the four files of `migration/parity/` at its root.
      - name: Download the parity-report artifact
        uses: actions/download-artifact@v4
        with:
          name: parity-report
          path: published

      - name: Commit generated files to parity-data
        run: |
          set -euo pipefail
          GENERATED=(report.md coverage.json baseline.json)
          for file in "${GENERATED[@]}"; do
            if [ ! -f "published/$file" ]; then
              echo "::error::published/$file missing from the parity-report artifact"; exit 1
            fi
          done

          git config user.name 'star-labs-parity-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Adopt the live parity-data history (or start a data-only branch on
          # the first run). canvas_manifest.json is an input, so it is not
          # republished here.
          sync_parity_data() {
            if git ls-remote --exit-code --heads origin parity-data >/dev/null 2>&1; then
              # "+" is required: this clone is shallow, so git cannot prove the
              # remote tip descends from our cached one and would refuse the
              # update, leaving every retry built on a stale base.
              git fetch --depth 1 origin "+refs/heads/parity-data:refs/remotes/origin/parity-data"
              git checkout -B parity-data refs/remotes/origin/parity-data
            else
              echo "parity-data does not exist yet; creating a data-only branch"
              # A rejected earlier attempt can leave the local ref behind; the
              # orphan switch refuses to reuse it.
              git show-ref --verify --quiet refs/heads/parity-data && git branch -q -D parity-data
              git checkout --orphan parity-data
              git rm -r --cached --quiet . || true
            fi
            for file in "${GENERATED[@]}"; do
              cp "published/$file" "migration/parity/$file"
              git add "migration/parity/$file"
            done
          }

          base_commit=$(git rev-parse HEAD)
          for attempt in 1 2 3; do
            sync_parity_data
            if git diff --cached --quiet; then
              echo "parity-data already matches this run's report; nothing to commit"
              exit 0
            fi
            git commit --quiet \
              -m "docs(parity): refresh scoreboard from CI ${GITHUB_SHA} [skip ci]" \
              -m "Generated by the Parity scoreboard workflow (run ${GITHUB_RUN_ID}) for ${GITHUB_REF_NAME}@${GITHUB_SHA}." \
              -m "Committed files are the parity-report artifact bytes. Implements issue #74."
            if git push --porcelain origin "HEAD:refs/heads/parity-data"; then
              echo "published the scoreboard to parity-data"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); re-syncing onto the current parity-data tip"
            # -f: main's files were untracked in the data-only attempt above.
            git checkout -q -f --detach "$base_commit"
            sleep "$((attempt * 3))"
          done

          echo "::error::could not publish the parity report after 3 attempts"
          exit 1
