name: Production build

on:
  push:
    branches: [main]
    paths:
      - 'migration/**'
      - '.github/workflows/production-build.yml'
  pull_request:
    paths:
      - 'migration/**'
      - '.github/workflows/production-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Quality gates: formatting and linting must pass before any build.
  # ---------------------------------------------------------------------------
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration -> target
      - name: Enforce rustfmt
        run: cargo fmt --all -- --check
      - name: Enforce clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Tests against a real PostgreSQL service (debug profile; fastest feedback).
  # ---------------------------------------------------------------------------
  test:
    name: Test (debug, PostgreSQL)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: star
          POSTGRES_PASSWORD: star-test-only
          POSTGRES_DB: star_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U star -d star_lms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://star:star-test-only@localhost:5432/star_lms_test
      STAR_JWT_SECRET: github-actions-test-secret
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration -> target
      - name: Run workspace tests
        run: cargo test --workspace --exclude star-http
      - name: Verify star-http builds with tests
        run: cargo test -p star-http --no-run

  # ---------------------------------------------------------------------------
  # Production release build: optimised binary, locked deps, uploaded artifact.
  # This is the build that lab-deploy.sh reproduces on the lab host.
  # ---------------------------------------------------------------------------
  release-build:
    name: Release build (production)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration -> target
      - name: Build release binary
        run: cargo build --release --locked --manifest-path migration/Cargo.toml
      - name: Record metadata
        run: |
          printf 'branch=%s\ncommit=%s\ndate=%s\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > migration/target/release/BUILD_INFO
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: star-lms-release-${{ github.sha }}
          path: |
            migration/target/release/star-http
            migration/target/release/BUILD_INFO
          if-no-files-found: error
          retention-days: 14
