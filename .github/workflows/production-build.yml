name: Production build

# Fan-out: quality, security and the two release builds all start immediately.
# The workspace test suite lives in `rust-migration.yml` (sharded, 4 runners) —
# it is deliberately NOT duplicated here, which used to double every push's
# test cost. Release builds run on `main` and on demand; PRs get the full
# compile via clippy --all-targets plus the sharded test suite.
#
# Wave-4 fast path: docs-only PRs (classified by tools/ci/change_class.py via
# the `changes` job) skip the fmt/clippy steps; the `Format and lint` job still
# runs and reports green so the required check name is unchanged. The
# migration-file hygiene check always runs (no toolchain needed).

on:
  push:
    branches: [main]
    paths:
      - 'migration/**'
      - '.github/workflows/production-build.yml'
  pull_request:
    paths:
      - 'specs/**'
      - 'migration/**'
      - 'orchestration/**'
      - 'tools/ci/**'
      - 'browser-smoke/**'
      - '.github/workflows/production-build.yml'
  merge_group:
  workflow_dispatch:
    inputs:
      release:
        description: 'Run the release build matrix on this ref'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Fast-path gate: classify the diff so docs-only PRs can skip the Rust
  # toolchain work. Non-pull_request events short-circuit to a full run.
  # Rules live in tools/ci/change_class.py (single source of truth).
  # ---------------------------------------------------------------------------
  changes:
    name: Change class
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.class.outputs.rust }}
      lab: ${{ steps.class.outputs.lab }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify the diff
        id: class
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            {
              echo "rust=true"
              echo "lab=true"
            } >> "$GITHUB_OUTPUT"
            echo "event '${{ github.event_name }}' — full run by design"
            exit 0
          fi
          # base...head compare: exactly this PR's changes. API hiccups and
          # truncated lists (>=300 files) degrade to a full run, never to a
          # wrong skip.
          payload=""
          for attempt in 1 2 3; do
            if payload="$(gh api "repos/$REPO/compare/$BASE...$HEAD")"; then
              break
            fi
            echo "compare API attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          if [ -z "$payload" ]; then
            echo "::warning::compare unavailable — defaulting to full run"
            {
              echo "rust=true"
              echo "lab=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$payload" | python3 tools/ci/change_class.py --github-output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Quality gates: formatting, linting, migration-file hygiene. This job is
  # the required check `Format and lint` and therefore always runs; the
  # toolchain steps are conditional on the PR actually changing Rust source.
  # ---------------------------------------------------------------------------
  quality:
    name: Format and lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          workspaces: migration -> target
          shared-key: quality
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enforce rustfmt
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: Enforce clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify migration files are unique and well formed
        run: |
          set -euo pipefail
          cd crates/star-db/migrations
          bad=$(ls -1 | grep -Ev '^[0-9]{4}_[a-z0-9_]+\.sql$' || true)
          if [ -n "$bad" ]; then
            echo "::error::unexpected migration filenames:"; echo "$bad"; exit 1
          fi
          dups=$(ls -1 | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::duplicate migration prefixes:"; echo "$dups"; exit 1
          fi
      - name: Report fast path
        if: needs.changes.outputs.rust != 'true'
        run: |
          echo "no Rust-source changes in this PR — fmt/clippy skipped by design."
          echo "full run happens on merge to main, on merge_group, and on dispatch."

  # ---------------------------------------------------------------------------
  # Dependency vulnerability audit (RustSec advisory database).
  # ---------------------------------------------------------------------------
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: migration
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock

  # ---------------------------------------------------------------------------
  # Production release builds. glibc and musl are separate parallel jobs (they
  # used to run back-to-back in one 45-minute job). Each boots its own binary
  # and smoke-tests /health against a real PostgreSQL service.
  # ---------------------------------------------------------------------------
  release-build:
    name: Release build (${{ matrix.target }})
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: glibc
            triple: x86_64-unknown-linux-gnu
            cargo_target_flag: ''
            binary: target/release/star-http
            artifact: star-lms-release
          - target: musl
            triple: x86_64-unknown-linux-musl
            cargo_target_flag: '--target x86_64-unknown-linux-musl'
            binary: target/x86_64-unknown-linux-musl/release/star-http
            artifact: star-lms-release-musl
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: star
          POSTGRES_PASSWORD: star-test-only
          POSTGRES_DB: star_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U star -d star_lms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://star:star-test-only@localhost:5432/star_lms_test
      STAR_JWT_SECRET: github-actions-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: migration -> target
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install musl toolchain
        if: matrix.target == 'musl'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build release binary
        run: cargo build --release --locked ${{ matrix.cargo_target_flag }} --manifest-path migration/Cargo.toml
      - name: Record metadata
        run: |
          printf 'branch=%s\ncommit=%s\ndate=%s\ntarget=%s\n' \
            "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ matrix.triple }}" \
            > "$(dirname migration/${{ matrix.binary }})/BUILD_INFO"
      - name: Smoke test release binary
        working-directory: migration
        run: |
          set -euo pipefail
          bin="${{ matrix.binary }}"
          port=$((18080 + RANDOM % 500))
          STAR_PORT=$port "$bin" &
          pid=$!
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$port/health" > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "::error::$bin did not answer /health"; exit 1
          fi
          echo "$bin answered /health"
      - name: Stage artifact
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp "migration/${{ matrix.binary }}" artifact/star-http
          cp "$(dirname migration/${{ matrix.binary }})/BUILD_INFO" artifact/BUILD_INFO
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
