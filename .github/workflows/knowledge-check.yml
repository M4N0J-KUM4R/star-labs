name: Knowledge vault is current

# The agent knowledge vault's facts are generated from committed artefacts.
# If they are stale, an agent reading them gets a wrong answer with full
# confidence — the exact failure the vault exists to prevent.
#
# So: regenerate, and fail if the committed copy differs. Same pattern as the
# parity replay report.

on:
  push:
    branches: [main]
    paths:
      - 'migration/parity/**'
      - 'migration/rust/app-cases/**'
      - 'migration/crates/star-db/migrations/**'
      - 'migration/tools/knowledge/**'
      - 'docs/knowledge/**'
      - '.github/workflows/knowledge-check.yml'
  pull_request:
    paths:
      - 'migration/parity/**'
      - 'migration/rust/app-cases/**'
      - 'migration/crates/star-db/migrations/**'
      - 'migration/tools/knowledge/**'
      - 'docs/knowledge/**'
      - '.github/workflows/knowledge-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate the knowledge facts
        run: python3 tools/knowledge/gen_knowledge.py

      - name: Regenerate the gap report
        run: python3 tools/knowledge/gen_gap_report.py

      - name: Regenerate the per-family briefs
        run: python3 tools/knowledge/gen_briefs.py

      - name: Gate the facts that describe committed artefacts
        # schema-truth is derived from the recorded corpus and the
        # migrations; route-map attributes every Canvas route to the crate
        # that registers it and reads that out of the committed crate
        # sources. Both are therefore verifiable on a committed tree, and a
        # difference means the committed facts no longer describe the tree.
        #
        # The gap report and the parity state are derived from the replay
        # report, which changes whenever the corpus is re-recorded; they are
        # regenerated and printed below, but not gated.
        run: |
          if ! git diff --exit-code -- \
              docs/knowledge/facts/schema-truth.md \
              docs/knowledge/facts/route-map.md; then
            echo "::error::the committed facts are stale. Run:"
            echo "  python3 tools/knowledge/gen_knowledge.py"
            echo "  python3 tools/knowledge/gen_gap_report.py"
            echo "  python3 tools/knowledge/gen_briefs.py"
            git diff --stat -- docs/knowledge/ | tail -20
            exit 1
          fi

      - name: Report whether the committed facts are stale
        # The facts describe the tree they were generated from, and the
        # crate changes that produced the current ones are not committed yet.
        # So this reports staleness instead of failing; the hard gate lands
        # with the crate changes, in the same commit that regenerates the
        # facts against the committed tree.
        # route-map and schema-truth are derived from committed artefacts
        # (the route registry, the corpus, the migrations), so a difference
        # means the committed facts no longer describe the tree.
        #
        # The gap report and the parity state are derived from the replay
        # report, which changes whenever the corpus is re-recorded; they are
        # regenerated here and printed, but not gated — otherwise every
        # re-recording would fail CI over a measurement, not a defect.
        # schema-truth is derived from the recorded corpus and the
        # migrations — both committed — so it is verifiable here.
        #
        # route-map also attributes each route to the crate that registers
        # it, which it reads out of the crate sources. It is therefore only
        # verifiable on a tree whose crates are committed; it is gated in the
        # same commit that lands the crate changes.
        run: |
          if ! git diff --exit-code -- docs/knowledge/facts/schema-truth.md; then
            echo "::warning::the committed facts are stale. Run:"
            echo "  python3 tools/knowledge/gen_knowledge.py"
            echo "  python3 tools/knowledge/gen_gap_report.py"
            echo "  python3 tools/knowledge/gen_briefs.py"
            git diff --stat -- docs/knowledge/ | tail -20
          fi

      - name: Show what changed
        if: always()
        run: git diff --stat -- docs/knowledge/ || true
