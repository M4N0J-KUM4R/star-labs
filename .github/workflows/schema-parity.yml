name: schema-parity

# Conformance job: replay star-db's migrations into a fresh pgvector/pg16 and
# diff the live schema against the Canvas db/migrate reference
# (migration/parity/canvas_schema_reference.json, generated by
# migration/tools/schema/canvas_reference.py from canvas-src).
#
# Day one: a missing reference TABLE fails the job unless it is in
# migration/parity/schema_gap_allowlist.json (currently exactly the three
# *_embeddings tables). Missing reference COLUMNS (567 across 70 tables on
# the first full measurement) are reported into the step summary but do not
# gate — they are the additive Wave 1.2 backlog and must shrink
# monotonically. Type / nullability / default / index / FK deltas are
# reported into the step summary but do not gate.

on:
  push:
    branches: [main]
    paths:
      - 'migration/crates/star-db/**'
      - 'migration/tools/schema/**'
      - '.github/workflows/schema-parity.yml'
  pull_request:
    paths:
      - 'migration/crates/star-db/**'
      - 'migration/tools/schema/**'
      - '.github/workflows/schema-parity.yml'

jobs:
  schema-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: star
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/star
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Verify schema parity
        run: python3 migration/tools/schema/verify_schema_parity.py

      - name: Append gap report to job summary
        if: always()
        run: cat migration/parity/schema_gap.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload schema_gap artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema_gap
          path: |
            migration/parity/schema_gap.json
            migration/parity/schema_gap.md
